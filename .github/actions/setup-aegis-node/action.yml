name: Set up Aegis native build
description: Pinned Node, Rust and optional Android toolchain
inputs:
  android:
    description: Install Android SDK and NDK
    default: 'false'
  cache-variant:
    description: Separate dependency cache for emulator architecture
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: apps/aegis-node/package-lock.json
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: '1.94.0'
        targets: ${{ inputs.android == 'true' && 'aarch64-linux-android' || 'x86_64-pc-windows-msvc' }}
    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        workspaces: apps/aegis-node/src-tauri -> target
        shared-key: ${{ inputs.cache-variant && format('{0}-{1}-{2}', runner.os, inputs.android, inputs.cache-variant) || format('{0}-{1}', runner.os, inputs.android) }}
        cache-on-failure: ${{ inputs.cache-variant != '' }}
    - if: inputs.android == 'true'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - if: inputs.android == 'true'
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - if: inputs.android == 'true'
      shell: bash
      run: |
        sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
    - shell: bash
      working-directory: packages/aegis-client
      run: npm ci
    - shell: bash
      working-directory: apps/aegis-node
      run: npm ci
