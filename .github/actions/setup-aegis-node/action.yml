name: Set up Aegis native build
description: Pinned Node, Rust and optional Android toolchain
inputs:
  android:
    description: Install Android SDK and NDK
    default: 'false'
  cache-variant:
    description: Separate dependency cache for emulator architecture
    default: ''
  gradle-cache-variant:
    description: Separate Gradle dependencies by Android build workload
    default: ''
  gradle-cache-seed-variant:
    description: Optional compatible, reviewed dependency-only seed workload on a cache miss
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: apps/aegis-node/package-lock.json
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: '1.94.0'
        targets: ${{ inputs.android == 'true' && 'aarch64-linux-android' || 'x86_64-pc-windows-msvc' }}
    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        workspaces: apps/aegis-node/src-tauri -> target
        shared-key: ${{ inputs.cache-variant && format('{0}-{1}-{2}', runner.os, inputs.android, inputs.cache-variant) || format('{0}-{1}', runner.os, inputs.android) }}
        cache-on-failure: true
    - if: inputs.android == 'true'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - if: inputs.android == 'true'
      name: Identify Gradle dependency and legacy seed caches
      id: gradle-cache
      shell: bash
      env:
        VARIANT: ${{ inputs.gradle-cache-variant || inputs.cache-variant || 'arm64-full' }}
        SEED_VARIANT: ${{ inputs.gradle-cache-seed-variant }}
        WRAPPER_HASH: ${{ hashFiles('apps/aegis-node/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
        LEGACY_HASH: ${{ hashFiles('apps/aegis-node/src-tauri/gen/android/**/*.gradle', 'apps/aegis-node/src-tauri/gen/android/**/*.gradle.kts', 'apps/aegis-node/src-tauri/gen/android/**/gradle.properties', 'apps/aegis-node/src-tauri/gen/android/**/gradle-wrapper.properties') }}
        DEPENDENCIES_HASH: ${{ hashFiles('apps/aegis-node/src-tauri/gen/android/**/*.gradle', 'apps/aegis-node/src-tauri/gen/android/**/*.gradle.kts', 'apps/aegis-node/src-tauri/gen/android/**/gradle.properties', 'apps/aegis-node/src-tauri/gen/android/**/gradle-wrapper.properties', 'apps/aegis-node/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar', 'apps/aegis-node/src-tauri/gen/android/**/buildSrc/src/**', 'apps/aegis-node/src-tauri/gen/android/**/*.versions.toml', 'apps/aegis-node/src-tauri/gen/android/**/versions.properties', 'apps/aegis-node/src-tauri/gen/android/**/gradle.lockfile', 'apps/aegis-node/src-tauri/gen/android/**/dependency-locks/**', 'apps/aegis-node/src-tauri/gen/android/**/verification-metadata.xml', 'apps/aegis-node/src-tauri/Cargo.lock', 'apps/aegis-node/src-tauri/Cargo.toml', 'apps/aegis-node/package-lock.json', 'packages/aegis-client/package-lock.json', '.github/workflows/aegis-node-ci.yml', '.github/workflows/aegis-release-identity-ci.yml', '.github/workflows/aegis-native-preview.yml', '.github/actions/setup-aegis-node/action.yml') }}
      run: |
        [[ "$VARIANT" =~ ^[a-zA-Z0-9_-]+$ ]]
        [[ "$SEED_VARIANT" =~ ^[a-zA-Z0-9_-]*$ ]]
        for hash in "$WRAPPER_HASH" "$LEGACY_HASH" "$DEPENDENCIES_HASH"; do [[ "$hash" =~ ^[a-f0-9]{64}$ ]]; done
        gradle_home="$(node -p 'require("node:os").homedir()')/.gradle"
        arch="$(node -p 'process.arch')"
        prefix="aegis-gradle-modules-v1-${RUNNER_OS}-${arch}-java17-${VARIANT}-${WRAPPER_HASH}-"
        echo "home=$gradle_home" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${DEPENDENCIES_HASH}" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        if [[ -n "$SEED_VARIANT" ]]; then
          echo "seed-prefix=aegis-gradle-modules-v1-${RUNNER_OS}-${arch}-java17-${SEED_VARIANT}-${WRAPPER_HASH}-" >> "$GITHUB_OUTPUT"
        fi
        echo "legacy=setup-java-${RUNNER_OS}-${arch}-gradle-${LEGACY_HASH}" >> "$GITHUB_OUTPUT"
        echo "wrapper=setup-java-${RUNNER_OS}-${arch}-gradle-wrapper-${WRAPPER_HASH}" >> "$GITHUB_OUTPUT"
    - if: inputs.android == 'true'
      name: Cache Gradle wrapper distribution
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.gradle-cache.outputs.home }}/wrapper
        key: ${{ steps.gradle-cache.outputs.wrapper }}
    - if: inputs.android == 'true'
      name: Cache resolved Gradle dependencies for this workload
      id: gradle-dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        # Do not archive project outputs, user properties, signing credentials,
        # or modules-2.lock/gc.properties in the parent of these directories.
        path: |
          ${{ steps.gradle-cache.outputs.home }}/caches/modules-2/files-*
          ${{ steps.gradle-cache.outputs.home }}/caches/modules-2/metadata-*
          ${{ steps.gradle-cache.outputs.home }}/caches/modules-2/resources-*
        key: ${{ steps.gradle-cache.outputs.key }}
        restore-keys: |
          ${{ steps.gradle-cache.outputs.prefix }}
          ${{ steps.gradle-cache.outputs.seed-prefix }}
    - if: inputs.android == 'true' && steps.gradle-dependencies.outputs.cache-hit == ''
      name: Seed empty Gradle dependency cache from previous setup-java cache
      id: legacy-gradle-seed
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        # Same absolute path and key format as the previous setup-java v5.
        # Read-only seed: never overwrite or refresh the old common cache.
        path: ${{ steps.gradle-cache.outputs.home }}/caches
        key: ${{ steps.gradle-cache.outputs.legacy }}
    - if: inputs.android == 'true' && steps.legacy-gradle-seed.outputs.cache-hit == 'true'
      name: Discard copied Gradle module lock and cleanup state before building
      shell: bash
      env:
        GRADLE_CACHE_HOME: ${{ steps.gradle-cache.outputs.home }}
      run: rm -f -- "$GRADLE_CACHE_HOME/caches/modules-2/modules-2.lock" "$GRADLE_CACHE_HOME/caches/modules-2/gc.properties"
    - if: inputs.android == 'true'
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - if: inputs.android == 'true'
      shell: bash
      run: |
        sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
    - shell: bash
      working-directory: packages/aegis-client
      run: npm ci
    - shell: bash
      working-directory: apps/aegis-node
      run: npm ci
