name: Aegis Node Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag, e.g. node-v0.7.0 or node-v0.7.0-unstable.19
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: aegis-native-distribution
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Restrict historical signing to the reviewed main control plane
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW: ${{ github.repository }}/.github/workflows/aegis-node-release.yml@refs/heads/main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$WORKFLOW_REF" = "$EXPECTED_WORKFLOW"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require signing protection before scheduling any signing job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { assertEnvironment, signingEnvironment } from './.github/scripts/native-preview.mjs';
          const get = async path => {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if (!response.ok) throw Error(`Cannot verify signing protection: HTTP ${response.status}`);
            return response.json();
          };
          const environment = await get(`environments/${signingEnvironment}`);
          const policies = [];
          for (let page=1;;page++) {
            const result = await get(`environments/${signingEnvironment}/deployment-branch-policies?per_page=100&page=${page}`);
            policies.push(...result.branch_policies);
            if (result.branch_policies.length < 100) break;
          }
          assertEnvironment(environment, {branch_policies:policies});
          JS
      - id: resolve
        name: Resolve the existing release tag once
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^node-v[0-9]+\.[0-9]+\.[0-9]+(?:-unstable\.[1-9][0-9]*)?$/.test(tag)) throw Error('Expected an existing node version tag.');
          const sha = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], {encoding:'utf8'}).trim();
          if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Expected a full immutable SHA.');
          // The historical path runs build scripts with keys after approval.
          // Never let it sign arbitrary branch code, even with a legacy endpoint.
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'refs/remotes/origin/main'], {stdio:'pipe'});
          const config = JSON.parse(execFileSync('git', ['show', `${sha}:apps/aegis-node/src-tauri/tauri.conf.json`], {encoding:'utf8'}));
          if (config.plugins.updater.endpoints.some(url => url.includes('/aegis-distribution/')))
            throw Error('Use Aegis Native Preview (stable runs require full acceptance), then protected Native Promote for v2 distributions.');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          JS
  acceptance:
    needs: resolve
    uses: ./.github/workflows/aegis-node-ci.yml
    with:
      stage: release
      full_matrix: true
      ref: ${{ needs.resolve.outputs.sha }}
  build:
    needs: [resolve, acceptance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            android: 'false'
            platform: Windows-x86_64
          - os: ubuntu-24.04
            android: 'true'
            platform: Android-arm64
    runs-on: ${{ matrix.os }}
    environment: aegis-native-signing
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Validate tag and required signing secrets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_ANDROID: ${{ matrix.android }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { releaseKind } = await import('./scripts/publish-release.mjs');
          const version = JSON.parse(readFileSync('package.json')).version;
          releaseKind(version);
          if (process.env.RELEASE_TAG !== `node-v${version}`) throw new Error('Tag must match package.json: node-v' + version);
          const required = process.env.BUILD_ANDROID === 'true'
            ? ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD', 'FIREBASE_ANDROID_CONFIG_B64']
            : ['TAURI_SIGNING_PRIVATE_KEY'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error('Missing GitHub signing secrets: ' + missing.join(', '));
          JS
      - name: Verify stable tags identify the same integrated commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^node-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git fetch origin refs/heads/main:refs/remotes/origin/main "refs/tags/${RELEASE_TAG#node-}:refs/tags/${RELEASE_TAG#node-}"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG#node-}^{commit}")"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: ${{ matrix.android }}
      - if: matrix.android == 'true'
        name: Require the existing Firebase Android client configuration
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('distribution', 'scripts/verify-android-distribution.py')
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          value = os.environ.get('FIREBASE_ANDROID_CONFIG_B64', '')
          if not value:
              raise SystemExit('Firebase client configuration is required for distribution.')
          try:
              decoded = base64.b64decode(value, validate=True)
              guard.firebase_expected(json.loads(decoded))
          except Exception:
              raise SystemExit('Firebase client configuration does not match the existing Android app.') from None
          target = Path('src-tauri/gen/android/app/google-services.json')
          target.write_bytes(decoded)
          target.chmod(0o600)
          PYTHON
      - run: npm run check && npm test && npm run test:release && npm run test:rust
      - if: matrix.android == 'false'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/aegis-node
          args: --target x86_64-pc-windows-msvc
      - if: matrix.android == 'false'
        run: node scripts/package-artifacts.mjs windows --signed
      - if: matrix.android == 'false'
        name: Verify signed upgrade preserves installed version and application profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../../packages/aegis-client/tests/windows-release-upgrade.mjs release-assets/Aegis-Windows-x86_64-Setup.exe
      - if: matrix.android == 'false'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Windows-release-upgrade-evidence
          if-no-files-found: error
          path: |
            artifacts/release-identity/*
      - if: matrix.android == 'true'
        name: Decode private Android keystore without logging credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'aegis-release.p12'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PYTHON
      - if: matrix.android == 'true'
        name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android:release
      - if: matrix.android == 'true'
        name: Verify distributable Android identity, configuration and fixture exclusion
        run: |
          python3 -m unittest discover -s scripts -p verify_android_distribution_test.py
          node scripts/package-artifacts.mjs android
          python3 scripts/verify-android-distribution.py \
            --apk release-assets/Aegis-Android-arm64.apk \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 release-assets/Aegis-Android-arm64.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: apps/aegis-node/release-assets/*
      - if: always() && matrix.android == 'true'
        name: Remove private keystore
        run: rm -f "$RUNNER_TEMP/aegis-release.p12"
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.94.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Release-*
          merge-multiple: true
          path: apps/aegis-node/release-assets
      - name: Verify Windows installer against the existing updater public key
        shell: bash
        run: |
          verifier="$RUNNER_TEMP/aegis-updater-verifier"
          mkdir -p "$verifier/src"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'aegis-updater-verifier');
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          writeFileSync(join(directory, 'updater.pub'), Buffer.from(config.plugins.updater.pubkey, 'base64'));
          writeFileSync(join(directory, 'installer.sig'), Buffer.from(readFileSync('release-assets/Aegis-Windows-x86_64-Setup.exe.sig', 'utf8').trim(), 'base64'));
          JS
          cat > "$verifier/Cargo.toml" <<'TOML'
          [package]
          name = "aegis-release-signature-verifier"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          minisign-verify = "=0.2.5"
          TOML
          cat > "$verifier/src/main.rs" <<'RUST'
          use minisign_verify::{PublicKey, Signature};
          fn main() {
              let args: Vec<_> = std::env::args().collect();
              assert_eq!(args.len(), 5, "Expected installer, public key, signature and version");
              let data = std::fs::read(&args[1]).expect("Installer must be readable");
              let key = PublicKey::from_file(&args[2]).expect("Committed updater public key must be valid");
              let signature = Signature::from_file(&args[3]).expect("Updater signature must have a valid format");
              key.verify(&data, &signature, true).expect("Installer must verify against the existing updater public key");
              assert!(signature.trusted_comment().split('\t').any(|field| field == format!("version:{}", args[4])), "Signed version must match this release");
              println!("Windows updater cryptographic signature and signed version PASS.");
          }
          RUST
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          cargo run --quiet --manifest-path "$verifier/Cargo.toml" -- \
            "$PWD/release-assets/Aegis-Windows-x86_64-Setup.exe" \
            "$verifier/updater.pub" "$verifier/installer.sig" "$version"
      - name: Generate deterministic metadata and publish immutable native distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_DATE="$(git show -s --format=%cI HEAD)"
          node scripts/release-metadata.mjs release-assets "$RELEASE_TAG"
          node scripts/publish-release.mjs
