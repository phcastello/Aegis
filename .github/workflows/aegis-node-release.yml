name: Aegis Node Release
on:
  push:
    tags: ['node-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag, e.g. node-v0.7.0-stage.2
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aegis-node-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            android: 'false'
            platform: Windows-x86_64
          - os: ubuntu-24.04
            android: 'true'
            platform: Android-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag and required signing secrets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_ANDROID: ${{ matrix.android }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json')).version;
          if (process.env.RELEASE_TAG !== `node-v${version}`) throw new Error('Tag must match package.json: node-v' + version);
          const required = process.env.BUILD_ANDROID === 'true'
            ? ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
            : ['TAURI_SIGNING_PRIVATE_KEY'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error('Missing GitHub signing secrets: ' + missing.join(', '));
          JS
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: ${{ matrix.android }}
      - run: npm run check && npm test && npm run test:release && npm run test:rust
      - if: matrix.android == 'false'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/aegis-node
          args: --target x86_64-pc-windows-msvc
      - if: matrix.android == 'false'
        run: node scripts/package-artifacts.mjs windows --signed
      - if: matrix.android == 'true'
        name: Decode private Android keystore without logging credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'aegis-release.p12'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PYTHON
      - if: matrix.android == 'true'
        name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android:release
      - if: matrix.android == 'true'
        name: Verify APK signing and package human-facing artifact
        run: |
          node scripts/package-artifacts.mjs android
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose release-assets/Aegis-Android-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 release-assets/Aegis-Android-arm64.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: apps/aegis-node/release-assets/*
      - if: always() && matrix.android == 'true'
        name: Remove private keystore
        run: rm -f "$RUNNER_TEMP/aegis-release.p12"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Release-*
          merge-multiple: true
          path: apps/aegis-node/release-assets
      - name: Generate deterministic metadata and publish preview releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_DATE="$(git show -s --format=%cI HEAD)"
          node scripts/release-metadata.mjs release-assets "$RELEASE_TAG"
          node scripts/publish-release.mjs
