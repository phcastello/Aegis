name: Aegis Node CI
on:
  push:
    branches: [main, 'feat/v0.7.0-*']
    paths: ['apps/aegis-node/**', 'packages/aegis-client/**', 'frontend/aegis-pwa/**', 'backend/**', 'deploy/**', 'scripts/node-transport-probe/**', '.github/**']
  pull_request:
    paths: ['apps/aegis-node/**', 'packages/aegis-client/**', 'frontend/aegis-pwa/**', 'backend/**', 'deploy/**', 'scripts/node-transport-probe/**', '.github/**']
  workflow_dispatch:
    inputs:
      ui_only:
        description: Focused browser/layout checks without native builds; takes precedence over other filters
        type: boolean
        default: false
      windows_only:
        description: Validate a focused Windows native fix before the full candidate matrix
        type: boolean
        default: false
      android_framework_only:
        description: Android framework checks without idle windows; Windows-only takes precedence; full matrix remains required
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: node-ci-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.ui_only && 'ui' || github.event_name == 'workflow_dispatch' && inputs.windows_only && 'windows' || github.event_name == 'workflow_dispatch' && inputs.android_framework_only && 'android-framework' || 'all' }}
  cancel-in-progress: true
jobs:
  regression:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.ui_only && !inputs.windows_only && !inputs.android_framework_only) }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis_nodes_test
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_nodes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AEGIS_NODE_TEST_DATABASE: 'Host=localhost;Database=aegis_nodes_test;Username=aegis_test;Password=test_only_password'
      AEGIS_REMINDER_TEST_DATABASE: 'Host=localhost;Database=aegis_nodes_test;Username=aegis_test;Password=test_only_password'
      AEGIS_MEMORY_TEST_DATABASE: 'Host=localhost;Database=aegis_nodes_test;Username=aegis_test;Password=test_only_password'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build backend/Aegis.sln
      - run: dotnet test backend/Aegis.sln --no-build --logger trx --results-directory artifacts/v0.7.0-completion/backend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Aegis-Backend-Regression
          path: artifacts/v0.7.0-completion/backend/*.trx
          retention-days: 7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/aegis-pwa/package-lock.json
      - name: Real authenticated transport through two Nginx proxy hops
        run: |
          npm ci --prefix scripts/node-transport-probe
          AEGIS_PROBE_NOTIFICATIONS=true node scripts/node-transport-probe/proxy-chain.mjs
      - name: Immutable native fixture command replay and bounded cache
        timeout-minutes: 2
        run: |
          dotnet build backend/tests/Aegis.NodeRuntimeFixture/Aegis.NodeRuntimeFixture.csproj
          node backend/tests/Aegis.NodeRuntimeFixture/reminder-command-replay.mjs
      - working-directory: packages/aegis-client
        run: npm ci
      - working-directory: frontend/aegis-pwa
        run: npm ci
      - working-directory: frontend/aegis-pwa
        run: npm run build
      - working-directory: frontend/aegis-pwa
        run: npm test
      - working-directory: apps/aegis-node
        run: npm ci
      - name: Use reachable HTTPS Ubuntu mirror for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          mirror = Path('/etc/apt/apt-mirrors.txt')
          if mirror.exists():
              mirror.write_text('https://archive.ubuntu.com/ubuntu/\n')
          Path('/etc/apt/apt.conf.d/99-aegis-ci-network').write_text(
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n')
          PYTHON
      - working-directory: packages/aegis-client
        run: npx playwright-core install --with-deps chromium
      - name: Browser regression of shared web and native UI (native IPC mocked)
        env:
          PARITY_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/v0.7.0-completion/ui
        run: |
          mkdir -p artifacts/v0.7.0-completion/ui
          npm run preview --prefix frontend/aegis-pwa -- --host 127.0.0.1 --port 18092 > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          npm run dev --prefix apps/aegis-node -- --host 127.0.0.1 > "$RUNNER_TEMP/native-vite.log" 2>&1 &
          npm run test:browser --prefix packages/aegis-client
          node apps/aegis-node/tests/update-notice-visual.mjs --output artifacts/v0.7.0-completion/ui/update-notice
          node apps/aegis-node/tests/places-browser.mjs
          node apps/aegis-node/tests/reminders-browser.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Aegis-UI-Captures
          path: artifacts/v0.7.0-completion/ui
          retention-days: 7
  ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/aegis-client/package-lock.json
            frontend/aegis-pwa/package-lock.json
            apps/aegis-node/package-lock.json
      - name: Build clients and check shared behavior
        run: |
          npm ci --prefix packages/aegis-client
          npm ci --prefix frontend/aegis-pwa
          npm ci --prefix apps/aegis-node
          npm run build --prefix frontend/aegis-pwa
          npm run build --prefix apps/aegis-node
          npm test --prefix apps/aegis-node
      - name: Install browser for visual checks
        working-directory: packages/aegis-client
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          mirror = Path('/etc/apt/apt-mirrors.txt')
          if mirror.exists():
              mirror.write_text('https://archive.ubuntu.com/ubuntu/\n')
          Path('/etc/apt/apt.conf.d/99-aegis-ci-network').write_text(
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n')
          PYTHON
          npx playwright-core install --with-deps chromium
      - name: Render real components and exercise sidebar/update navigation
        env:
          PARITY_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/v0.7.0-completion/ui
        run: |
          npm run preview --prefix frontend/aegis-pwa -- --host 127.0.0.1 --port 18092 > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          npm run dev --prefix apps/aegis-node -- --host 127.0.0.1 > "$RUNNER_TEMP/native-vite.log" 2>&1 &
          npm run test:browser --prefix packages/aegis-client
          node apps/aegis-node/tests/update-notice-visual.mjs --output artifacts/v0.7.0-completion/ui/update-notice
          node apps/aegis-node/tests/places-browser.mjs
          node apps/aegis-node/tests/reminders-browser.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Aegis-UI-Captures
          path: artifacts/v0.7.0-completion/ui
          retention-days: 7
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.ui_only && (!inputs.android_framework_only || inputs.windows_only)) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows_only && '[{"os":"windows-2022","android":"false","platform":"Windows-x86_64"}]' || '[{"os":"windows-2022","android":"false","platform":"Windows-x86_64"},{"os":"ubuntu-24.04","android":"true","platform":"Android-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: ${{ matrix.android }}
      - if: matrix.android == 'true'
        name: Install Firebase Android client configuration when provisioned
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          value = os.environ.get('FIREBASE_ANDROID_CONFIG_B64', '')
          if value:
              target = Path('src-tauri/gen/android/app/google-services.json')
              target.write_bytes(base64.b64decode(value, validate=True))
              target.chmod(0o600)
          else:
              print('Firebase client config absent: FCM build integration enabled; real push unavailable.')
          PYTHON
      - if: matrix.android == 'false'
        name: Validate Windows CDP observer without replacing native IPC
        run: node --test ../../packages/aegis-client/tests/windows-cdp-observer.test.mjs ../../packages/aegis-client/tests/windows-toast-history.test.mjs ../../packages/aegis-client/tests/windows-owned-window.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run test:rust
      - if: matrix.android == 'false'
        run: npm run check:rust
      - if: matrix.android == 'false'
        run: npm run test:rust:desktop
      - if: matrix.android == 'false'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          projectPath: apps/aegis-node
          args: --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - if: matrix.android == 'false'
        name: Install and verify the immutable public accepted Windows NSIS package
        run: node ../../packages/aegis-client/tests/windows-upgrade-idle.mjs install-before src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis "$RUNNER_TEMP/aegis-installed" "$RUNNER_TEMP/aegis-upgrade-plan.json"
      - if: matrix.android == 'false'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - if: matrix.android == 'false'
        name: Validate transport server contracts and lease races on Windows
        run: dotnet test ../../backend/tests/Aegis.Application.Tests --filter 'FullyQualifiedName~NodeTransportTests|FullyQualifiedName~NodeCapabilityTests'
      - if: matrix.android == 'false'
        name: Build isolated debug runtime for real Node identity acceptance
        env:
          AEGIS_NODE_API_BASE_URL: http://127.0.0.1:18104
        run: npm run tauri -- build --debug --no-bundle --target x86_64-pc-windows-msvc
      - if: matrix.android == 'false'
        name: Install isolated peer WebSocket fixture
        run: npm ci --prefix ../../scripts/node-transport-probe
      - if: matrix.android == 'false'
        name: Real Windows pairing, OS storage, restart, capabilities and target resolution
        run: node ../../packages/aegis-client/tests/windows-node-identity.mjs src-tauri/target/x86_64-pc-windows-msvc/debug/aegis-node.exe
      - if: matrix.android == 'false'
        name: Native HttpApi notification dispatch and Android push register refresh against real controllers
        run: node ../../scripts/node-transport-probe/native-http.mjs
      - if: matrix.android == 'false'
        name: Preserve the candidate executable for the idle comparison
        run: cp src-tauri/target/x86_64-pc-windows-msvc/debug/aegis-node.exe "$RUNNER_TEMP/aegis-idle-after.exe"
      - if: matrix.android == 'false'
        name: Build the immutable accepted baseline for an equivalent native idle window
        env:
          AEGIS_NODE_API_BASE_URL: http://127.0.0.1:18104
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/aegis-node/src-tauri/target
        run: |
          git fetch origin 43650d1c2cf58a1fc188e2c33eae0af579eabcac --depth=1
          git worktree add --detach "$RUNNER_TEMP/aegis-accepted-baseline" 43650d1c2cf58a1fc188e2c33eae0af579eabcac
          npm ci --prefix "$RUNNER_TEMP/aegis-accepted-baseline/packages/aegis-client"
          npm ci --prefix "$RUNNER_TEMP/aegis-accepted-baseline/apps/aegis-node"
          cd "$RUNNER_TEMP/aegis-accepted-baseline/apps/aegis-node"
          npm run tauri -- build --debug --no-bundle --target x86_64-pc-windows-msvc
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/aegis-node.exe" "$RUNNER_TEMP/aegis-idle-before.exe"
      - if: matrix.android == 'false'
        name: Real NSIS upgrade, same native identity and equivalent Windows idle windows
        run: node ../../packages/aegis-client/tests/windows-upgrade-idle.mjs compare "$AEGIS_UPGRADE_PLAN" "$RUNNER_TEMP/aegis-idle-before.exe" "$RUNNER_TEMP/aegis-idle-after.exe" ../../artifacts/v0.7.0-completion
      - if: matrix.android == 'false'
        name: Run real installed candidate Windows WebView2 smoke test
        run: node ../../packages/aegis-client/tests/windows-runtime.mjs "$AEGIS_INSTALLED_EXE"
      - if: ${{ !cancelled() && matrix.android == 'false' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aegis-Windows-Idle-Comparison
          path: |
            artifacts/v0.7.0-completion/windows-idle-*.json
            artifacts/v0.7.0-completion/windows-upgrade.json
            artifacts/v0.7.0-completion/windows-native-*.json
            artifacts/v0.7.0-completion/windows-native-*.png
          if-no-files-found: warn
          retention-days: 14
      - if: matrix.android == 'false'
        run: node scripts/package-artifacts.mjs windows
      - if: matrix.android == 'true'
        run: npm run build:android
      - if: matrix.android == 'true'
        name: Compile minified Android release with isolated CI signing key
        run: |
          AEGIS_CI_KEYSTORE="$RUNNER_TEMP/aegis-node-ci.p12"
          trap 'rm -f "$AEGIS_CI_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$AEGIS_CI_KEYSTORE" -storetype PKCS12 -storepass ci-test-only -keypass ci-test-only -alias aegis-ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Aegis CI' > /dev/null 2>&1
          export ANDROID_KEYSTORE_PATH="$AEGIS_CI_KEYSTORE"
          export ANDROID_KEYSTORE_PASSWORD=ci-test-only ANDROID_KEY_ALIAS=aegis-ci ANDROID_KEY_PASSWORD=ci-test-only
          npm run build:android:release
      - if: matrix.android == 'true'
        name: Android native payload validation unit tests
        run: src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:testUniversalDebugUnitTest
      - if: matrix.android == 'true'
        run: node scripts/package-artifacts.mjs android --debug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aegis-CI-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: apps/aegis-node/release-assets/*
  android-notification-framework:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.ui_only && !inputs.windows_only) }}
    name: Android framework API ${{ matrix.api }} (debug + minified release)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    env:
      AEGIS_NODE_API_BASE_URL: http://127.0.0.1:18104
      ORG_GRADLE_PROJECT_aegisFrameworkFixture: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: 'true'
          cache-variant: notification-framework-x86_64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Prepare KVM and isolated signing
        run: |
          rustup target add x86_64-linux-android
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          keytool -genkeypair -keystore "$RUNNER_TEMP/aegis-framework.p12" -storetype PKCS12 -storepass ci-test-only -keypass ci-test-only -alias aegis-ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Aegis framework CI' > /dev/null 2>&1
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aegis-framework.p12" >> "$GITHUB_ENV"
          echo 'ANDROID_KEYSTORE_PASSWORD=ci-test-only' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_ALIAS=aegis-ci' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_PASSWORD=ci-test-only' >> "$GITHUB_ENV"
      - name: Build debug APK and instrumentation
        id: debug_build
        run: |
          # The shared cache may contain the accepted worktree's Kotlin output path.
          # Refresh only Tauri codegen in both profiles before returning to this checkout.
          cargo clean --manifest-path src-tauri/Cargo.toml --package tauri --target x86_64-linux-android --profile dev
          cargo clean --manifest-path src-tauri/Cargo.toml --package tauri --target x86_64-linux-android --release
          npm run tauri -- android build --debug --apk --target x86_64 --features android-framework-fixture
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:assembleUniversalDebugAndroidTest -x :app:rustBuildUniversalDebug -PabiList=x86_64
      - name: Test renderer, native geofence receiver fixture and native live path
        id: debug_test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: node ../../scripts/node-transport-probe/android-native.mjs debug
      - name: Build minified release APK and instrumentation
        id: release_build
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          npm run tauri -- android build --apk --target x86_64 --features android-framework-fixture
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :notificationFrameworkTest:assembleRelease
      - name: Test minified renderer, geofence receiver fixture and fixed JNI methods
        id: release_test
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: |
            adb uninstall com.aegis.node.test || true
            adb uninstall com.aegis.node || true
            node ../../scripts/node-transport-probe/android-native.mjs release

      - name: Preserve candidate APK and generic instrumentation for idle comparison
        if: ${{ !cancelled() && matrix.api == 35 && !inputs.android_framework_only && steps.debug_test.outcome == 'success' && steps.release_test.outcome == 'success' }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$RUNNER_TEMP/aegis-idle-after.apk"
          cp src-tauri/gen/android/notificationFrameworkTest/build/outputs/apk/release/notificationFrameworkTest-release.apk "$RUNNER_TEMP/aegis-idle-test.apk"
      - name: Hybrid efficiency, six ten-minute windows with bounded active segments
        if: ${{ !cancelled() && matrix.api == 35 && !inputs.android_framework_only && steps.debug_test.outcome == 'success' && steps.release_test.outcome == 'success' }}
        timeout-minutes: 85
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: |
            node ../../scripts/node-transport-probe/android-hybrid-efficiency.mjs "$RUNNER_TEMP/aegis-idle-after.apk" "$RUNNER_TEMP/aegis-idle-test.apk" ../../artifacts/v0.7.0-completion
      - name: Build accepted Android baseline with the same isolated signing identity
        id: idle_baseline_build
        if: ${{ !cancelled() && matrix.api == 35 && !inputs.android_framework_only && steps.debug_test.outcome == 'success' && steps.release_test.outcome == 'success' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/aegis-node/src-tauri/target
        run: |
          git fetch origin 3b4babf5132060fc684b6738bf02e40e2fb7eed9 --depth=1
          git worktree add --detach "$RUNNER_TEMP/aegis-accepted-baseline" 3b4babf5132060fc684b6738bf02e40e2fb7eed9
          npm ci --prefix "$RUNNER_TEMP/aegis-accepted-baseline/packages/aegis-client"
          npm ci --prefix "$RUNNER_TEMP/aegis-accepted-baseline/apps/aegis-node"
          cd "$RUNNER_TEMP/aegis-accepted-baseline/apps/aegis-node"
          # Tauri2.12.1 codegen does not track changes to its Kotlin output directory.
          # Refresh that package when sharing dependency caches across immutable worktrees.
          cargo clean --manifest-path src-tauri/Cargo.toml --package tauri --target x86_64-linux-android --release
          npm run tauri -- android build --apk --target x86_64 --features android-framework-fixture
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$RUNNER_TEMP/aegis-idle-before.apk"
      - name: Equivalent Android idle windows before and after (ten minutes each)
        if: ${{ !cancelled() && matrix.api == 35 && !inputs.android_framework_only && steps.idle_baseline_build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: |
            node ../../scripts/node-transport-probe/android-idle.mjs "$RUNNER_TEMP/aegis-idle-before.apk" "$RUNNER_TEMP/aegis-idle-after.apk" "$RUNNER_TEMP/aegis-idle-test.apk" ../../artifacts/v0.7.0-completion
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() && matrix.api == 35 && !inputs.android_framework_only }}
        with:
          name: Aegis-Android-Idle-Comparison
          path: |
            artifacts/v0.7.0-completion/android-idle-*.json
            artifacts/v0.7.0-completion/android-hybrid-efficiency.json
          if-no-files-found: warn
          retention-days: 14
