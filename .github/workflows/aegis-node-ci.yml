name: Aegis Node CI
on:
  push:
    branches: [main, 'feat/v0.7.0-*']
    paths: ['apps/aegis-node/**', 'packages/aegis-client/**', 'frontend/aegis-pwa/**', 'backend/**', 'deploy/**', 'scripts/node-transport-probe/**', '.github/**']
  pull_request:
    paths: ['apps/aegis-node/**', 'packages/aegis-client/**', 'frontend/aegis-pwa/**', 'backend/**', 'deploy/**', 'scripts/node-transport-probe/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis_nodes_test
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_nodes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AEGIS_NODE_TEST_DATABASE: 'Host=localhost;Database=aegis_nodes_test;Username=aegis_test;Password=test_only_password'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build backend/Aegis.sln
      - run: dotnet test backend/Aegis.sln --no-build
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/aegis-pwa/package-lock.json
      - name: Real authenticated transport through two Nginx proxy hops
        run: |
          npm ci --prefix scripts/node-transport-probe
          AEGIS_PROBE_NOTIFICATIONS=true node scripts/node-transport-probe/proxy-chain.mjs
      - working-directory: packages/aegis-client
        run: npm ci
      - working-directory: frontend/aegis-pwa
        run: npm ci
      - working-directory: frontend/aegis-pwa
        run: npm run build
      - working-directory: frontend/aegis-pwa
        run: npm test
      - working-directory: apps/aegis-node
        run: npm ci
      - working-directory: packages/aegis-client
        run: npx playwright-core install --with-deps chromium
      - name: Browser regression of shared web and native UI (native IPC mocked)
        run: |
          npm run preview --prefix frontend/aegis-pwa -- --host 127.0.0.1 --port 18092 > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          npm run dev --prefix apps/aegis-node -- --host 127.0.0.1 > "$RUNNER_TEMP/native-vite.log" 2>&1 &
          npm run test:browser --prefix packages/aegis-client
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            android: 'false'
            platform: Windows-x86_64
          - os: ubuntu-24.04
            android: 'true'
            platform: Android-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: ${{ matrix.android }}
      - if: matrix.android == 'true'
        name: Install Firebase Android client configuration when provisioned
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          value = os.environ.get('FIREBASE_ANDROID_CONFIG_B64', '')
          if value:
              target = Path('src-tauri/gen/android/app/google-services.json')
              target.write_bytes(base64.b64decode(value, validate=True))
              target.chmod(0o600)
          else:
              print('Firebase client config absent: FCM build integration enabled; real push unavailable.')
          PYTHON
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run test:rust
      - if: matrix.android == 'false'
        run: npm run check:rust
      - if: matrix.android == 'false'
        run: npm run test:rust:desktop
      - if: matrix.android == 'false'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          projectPath: apps/aegis-node
          args: --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - if: matrix.android == 'false'
        name: Run real Windows WebView2 smoke test
        run: node ../../packages/aegis-client/tests/windows-runtime.mjs src-tauri/target/x86_64-pc-windows-msvc/release/aegis-node.exe
      - if: matrix.android == 'false'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - if: matrix.android == 'false'
        name: Validate transport server contracts and lease races on Windows
        run: dotnet test ../../backend/tests/Aegis.Application.Tests --filter 'FullyQualifiedName~NodeTransportTests|FullyQualifiedName~NodeCapabilityTests'
      - if: matrix.android == 'false'
        name: Build isolated debug runtime for real Node identity acceptance
        env:
          AEGIS_NODE_API_BASE_URL: http://127.0.0.1:18104
        run: npm run tauri -- build --debug --no-bundle --target x86_64-pc-windows-msvc
      - if: matrix.android == 'false'
        name: Install isolated peer WebSocket fixture
        run: npm ci --prefix ../../scripts/node-transport-probe
      - if: matrix.android == 'false'
        name: Real Windows pairing, OS storage, restart, capabilities and target resolution
        run: node ../../packages/aegis-client/tests/windows-node-identity.mjs src-tauri/target/x86_64-pc-windows-msvc/debug/aegis-node.exe
      - if: matrix.android == 'false'
        name: Native HttpApi notification dispatch and Android push register refresh against real controllers
        run: node ../../scripts/node-transport-probe/native-http.mjs
      - if: matrix.android == 'false'
        run: node scripts/package-artifacts.mjs windows
      - if: matrix.android == 'true'
        run: npm run build:android
      - if: matrix.android == 'true'
        name: Compile minified Android release with isolated CI signing key
        run: |
          AEGIS_CI_KEYSTORE="$RUNNER_TEMP/aegis-node-ci.p12"
          trap 'rm -f "$AEGIS_CI_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$AEGIS_CI_KEYSTORE" -storetype PKCS12 -storepass ci-test-only -keypass ci-test-only -alias aegis-ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Aegis CI' > /dev/null 2>&1
          export ANDROID_KEYSTORE_PATH="$AEGIS_CI_KEYSTORE"
          export ANDROID_KEYSTORE_PASSWORD=ci-test-only ANDROID_KEY_ALIAS=aegis-ci ANDROID_KEY_PASSWORD=ci-test-only
          npm run build:android:release
      - if: matrix.android == 'true'
        name: Android native payload validation unit tests
        run: src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:testUniversalDebugUnitTest
      - if: matrix.android == 'true'
        run: node scripts/package-artifacts.mjs android --debug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aegis-CI-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: apps/aegis-node/release-assets/*
  android-notification-framework:
    name: Android framework API ${{ matrix.api }} (debug + minified release)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    env:
      AEGIS_NODE_API_BASE_URL: http://127.0.0.1:18104
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: 'true'
          cache-variant: notification-framework-x86_64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Prepare KVM and isolated signing
        run: |
          rustup target add x86_64-linux-android
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          keytool -genkeypair -keystore "$RUNNER_TEMP/aegis-framework.p12" -storetype PKCS12 -storepass ci-test-only -keypass ci-test-only -alias aegis-ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Aegis framework CI' > /dev/null 2>&1
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aegis-framework.p12" >> "$GITHUB_ENV"
          echo 'ANDROID_KEYSTORE_PASSWORD=ci-test-only' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_ALIAS=aegis-ci' >> "$GITHUB_ENV"
          echo 'ANDROID_KEY_PASSWORD=ci-test-only' >> "$GITHUB_ENV"
      - name: Build debug APK and instrumentation
        id: debug_build
        run: |
          npm run tauri -- android build --debug --apk --target x86_64 --features android-framework-fixture
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:assembleUniversalDebugAndroidTest -x :app:rustBuildUniversalDebug -PabiList=x86_64
      - name: Test real renderer then real native live path
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: node ../../scripts/node-transport-probe/android-native.mjs debug
      - name: Build minified release APK and instrumentation
        id: release_build
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          npm run tauri -- android build --apk --target x86_64 --features android-framework-fixture
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :notificationFrameworkTest:assembleRelease
      - name: Test minified renderer and fixed JNI methods in real live execution
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: |
            adb uninstall com.aegis.node.test || true
            adb uninstall com.aegis.node || true
            node ../../scripts/node-transport-probe/android-native.mjs release
