name: Aegis Release Identity
on:
  workflow_call:
    inputs:
      ref:
        description: Exact immutable release ref for acceptance; defaults to the triggering ref
        type: string
        default: ''
      stage:
        type: string
        default: release
      full_matrix:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [integration, release]
        default: integration
        description: Validation stage; no idle measurements in this workflow
      windows_only:
        description: Only installed Windows WebView2 identity and runtime smoke tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-identity-${{ inputs.ref || github.head_ref || github.ref_name }}-${{ inputs.ref && 'release-acceptance' || 'checks' }}
  cancel-in-progress: true
jobs:
  selection:
    runs-on: ubuntu-24.04
    outputs:
      integration: ${{ steps.select.outputs.integration }}
      partial: ${{ steps.select.outputs.partial }}
      stage: ${{ steps.select.outputs.stage }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      evidence_sha: ${{ steps.select.outputs.evidence_sha }}
      identity: ${{ steps.select.outputs.identity }}
      windows: ${{ steps.select.outputs.identity == 'true' || (github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test .github/scripts/select-node-ci.test.mjs
      - id: select
        env:
          CI_INPUTS: ${{ toJSON(inputs) }}
        run: node .github/scripts/select-node-ci.mjs
  web:
    needs: selection
    if: ${{ needs.selection.outputs.identity == 'true' }}
    name: Shared and host identity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.selection.outputs.evidence_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/aegis-client/package-lock.json
            apps/aegis-node/package-lock.json
            frontend/aegis-pwa/package-lock.json
      - name: Install shared client and both hosts
        run: |
          npm ci --prefix packages/aegis-client
          npm ci --prefix apps/aegis-node
          npm ci --prefix frontend/aegis-pwa
      - name: Build both hosts for real identity App chains
        run: |
          npm run build --prefix frontend/aegis-pwa
          npm run build --prefix apps/aegis-node
      - name: Install Chromium for the real App chains
        working-directory: packages/aegis-client
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          mirror = Path('/etc/apt/apt-mirrors.txt')
          if mirror.exists():
              mirror.write_text('https://archive.ubuntu.com/ubuntu/\n')
          Path('/etc/apt/apt.conf.d/99-aegis-ci-network').write_text(
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n')
          PYTHON
          npx playwright-core install --with-deps chromium
      - name: Real native and web App chains across viewport and enlarged-font matrix
        env:
          IDENTITY_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/release-identity/browser
        run: node packages/aegis-client/tests/release-identity-browser.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Aegis-Shared-Host-Release-Identity
          path: artifacts/release-identity/browser
          if-no-files-found: warn
          retention-days: 14
  windows:
    needs: selection
    if: ${{ needs.selection.outputs.windows == 'true' }}
    name: Installed Windows WebView2 identity
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.selection.outputs.evidence_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-aegis-node
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          projectPath: apps/aegis-node
          args: --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Install the actual NSIS package in an isolated runner
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { install, installedExecutable } from '../../packages/aegis-client/tests/windows-upgrade-idle.mjs';
          const directory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis';
          const installers = readdirSync(directory).filter(name => name.endsWith('.exe'));
          if (installers.length !== 1) throw Error('Expected exactly one NSIS candidate.');
          const destination = join(process.env.RUNNER_TEMP, 'aegis-release-identity-installed');
          install(join(directory, installers[0]), destination);
          appendFileSync(process.env.GITHUB_ENV, `AEGIS_IDENTITY_INSTALLED_EXE=${installedExecutable(destination)}\n`);
          JS
      - name: Observe real Tauri IPC and capture sidebar and About in installed WebView2
        run: node ../../packages/aegis-client/tests/windows-release-identity.mjs "$AEGIS_IDENTITY_INSTALLED_EXE" ../../artifacts/release-identity
      - name: Verify installed Windows runtime, About version and lifecycle
        run: node ../../packages/aegis-client/tests/windows-runtime.mjs "$AEGIS_IDENTITY_INSTALLED_EXE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Aegis-Windows-Release-Identity
          path: artifacts/release-identity
          if-no-files-found: warn
          retention-days: 14
  android:
    needs: selection
    if: ${{ needs.selection.outputs.identity == 'true' }}
    name: Installed Android WebView identity (x86_64 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/aegis-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.selection.outputs.evidence_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-aegis-node
        with:
          android: 'true'
          cache-variant: release-identity-x86_64
      - name: Prepare emulator target and KVM
        run: |
          rustup target add x86_64-linux-android
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the actual Android UI in a development APK without framework fixtures
        run: npm run tauri -- android build --debug --apk --target x86_64
      - name: Observe real Tauri IPC and capture drawer and About in Android WebView
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/aegis-node
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: node ../../packages/aegis-client/tests/android-release-identity.mjs src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk ../../artifacts/release-identity
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Aegis-Android-Release-Identity
          path: artifacts/release-identity
          if-no-files-found: warn
          retention-days: 14
  required:
    name: Aegis Release Identity result
    needs: [selection, web, windows, android]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.selection.outputs.evidence_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { validateResults, validateIntegrationContext } from './.github/scripts/select-node-ci.mjs';
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          if (jobs.selection.result !== 'success') throw Error('Identity CI selection did not pass.');
          const selected = Object.fromEntries(Object.entries(jobs.selection.outputs).map(([key, value]) => [key, ['true','false'].includes(value) ? value === 'true' : value]));
          validateIntegrationContext(selected, {event:process.env.GITHUB_EVENT_NAME,payload:JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')),sha:process.env.GITHUB_SHA,checkoutSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()});
          validateResults(selected, jobs, { web: 'identity', windows: 'windows', android: 'identity' });
          JS
