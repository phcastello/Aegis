# Equivalent to Nginx Proxy Manager: Proxy Host > Details > Websockets Support = ON.
# Apply at EVERY proxy hop. Default forwarding preserves Authorization and
# X-Aegis-Node-Protocol; do not override/remove them in a parent/custom location.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_connect_timeout 30s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
