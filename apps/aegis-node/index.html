<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aegis</title>
  </head>

  <body>
    <div id="app">
      <main id="aegis-webview-unsupported" role="alert" hidden style="padding:32px;font-family:sans-serif;color:#e8edf7;background:#101827;min-height:100vh;box-sizing:border-box;">
