[package]
name = "aegis-node"
version = "0.7.0-stage.3"
description = "Aegis Android and Windows foundation"
authors = ["Aegis contributors"]
edition = "2021"
rust-version = "1.94"

[lib]
# Different names for the library and binary avoid Windows linker conflicts.
name = "aegis_node_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-runtime"]
# Allows portable unit tests without linking a desktop WebView runtime.
native-runtime = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
semver = "1"
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "2.13.1", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
