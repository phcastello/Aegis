[package]
name = "aegis-node"
version = "0.7.0-stage.4"
description = "Aegis Android and Windows foundation"
authors = ["Aegis contributors"]
edition = "2021"
rust-version = "1.94"

[lib]
# Different names for the library and binary avoid Windows linker conflicts.
name = "aegis_node_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-runtime"]
# Allows portable unit tests without linking a desktop WebView runtime.
native-runtime = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
semver = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(any(windows, target_os = "android"))'.dependencies]
keyring-core = "1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.13.1", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Pinned upstream OS backend with a documented commit-result durability correction.
[patch.crates-io]
android-native-keyring-store = { path = "vendor/android-native-keyring-store" }
