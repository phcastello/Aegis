map $http_upgrade $aegis_connection_upgrade {
  default upgrade;
  '' close;
}
upstream aegis_backend {
  server aegis-api:8090;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://aegis_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aegis_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Legacy clients send small attachments inline in the message envelope.
    location ~ ^/api/chat/messages(?:/stream)?$ {
      client_max_body_size 12m;
      proxy_pass http://aegis_backend;
    }

    location ~ ^/api/chat/uploads/[0-9a-fA-F-]+/chunks/[0-9]+$ {
      client_max_body_size 4m;
      proxy_request_buffering off;
      proxy_pass http://aegis_backend;
    }
  }

  location / {
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://raw.githubusercontent.com; base-uri 'none'; frame-ancestors 'none'; form-action 'none'";
    try_files $uri $uri/ /index.html;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-store" always;
    return 410;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /dev-sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
}
