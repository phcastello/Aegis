plugins { id 'java' }
repositories {
 google { metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() } }
 mavenCentral()
}
import org.gradle.api.artifacts.transform.*
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.attributes.*
import org.gradle.api.file.*
import org.gradle.api.provider.*
import org.gradle.api.tasks.*
import java.util.zip.ZipFile
abstract class AarToJar implements TransformAction<TransformParameters.None> {
 @InputArtifact abstract Provider<FileSystemLocation> getInputArtifact()
 void transform(TransformOutputs outputs) {
  File artifact = inputArtifact.get().asFile
  File out = outputs.file(artifact.name + '.jar')
  new ZipFile(artifact).withCloseable { zip ->
   def entry=zip.getEntry('classes.jar')
   if(entry!=null)out.withOutputStream { dest -> zip.getInputStream(entry).withCloseable { src -> dest << src } }
   else new java.util.jar.JarOutputStream(new FileOutputStream(out)).close()
  }
 }
}
dependencies {
 attributesSchema { attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE) }
 registerTransform(AarToJar) {
  from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'aar')
  to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
 }
 testImplementation files(providers.gradleProperty('productionJar').get())
 testImplementation('androidx.core:core:1.13.1@aar') { transitive = false }
 testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.17'
 testImplementation 'org.robolectric:android-all:15-robolectric-12650502'
}
configurations.testRuntimeClasspath.attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
configurations.testCompileClasspath.attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
test {
 maxHeapSize = '2g'
 systemProperty 'user.home', providers.gradleProperty('robolectricHome').getOrElse(System.getProperty('user.home'))
 systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
 systemProperty 'robolectric.graphicsMode', 'NATIVE'
 jvmArgs '--enable-native-access=ALL-UNNAMED', '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED', '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED', '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED'
 testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
}
