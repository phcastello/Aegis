services:
  aegis-pwa:
    build:
      context: ./frontend/aegis-pwa
      dockerfile: Dockerfile
      args:
        # Leave empty in Docker/PWA mode so the frontend calls /api/... through nginx.
        VITE_AEGIS_API_BASE_URL: ${VITE_AEGIS_API_BASE_URL:-}
    container_name: aegis-pwa
    depends_on:
      - aegis-api
    ports:
      - "${AEGIS_FRONTEND_PORT:-5173}:80"

  aegis-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-api
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AegisDatabase: ${AEGIS_DB_CONNECTION_STRING}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:14b}
      Ollama__Temperature: ${OLLAMA_TEMPERATURE:-0.6}
      Ollama__NumCtx: ${OLLAMA_NUM_CTX:-4096}
    ports:
      - "${AEGIS_API_PORT:-8080}:8080"

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: aegis-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
