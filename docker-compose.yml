services:
  aegis-pwa:
    build:
      context: .
      dockerfile: frontend/aegis-pwa/Dockerfile
      args:
        # Leave empty in Docker/PWA mode so the frontend calls /api/... through nginx.
        VITE_AEGIS_API_BASE_URL: ${VITE_AEGIS_API_BASE_URL:-}
    container_name: aegis-pwa
    depends_on:
      - aegis-api
    ports:
      - "${AEGIS_FRONTEND_PORT:-5173}:80"

  aegis-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-api
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
      - neo4j
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8090
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-}
      ConnectionStrings__AegisDatabase: ${AEGIS_DB_CONNECTION_STRING}
      AEGIS_WEB_PUSH_SUBJECT: ${AEGIS_WEB_PUSH_SUBJECT:-}
      AEGIS_WEB_PUSH_PUBLIC_KEY: ${AEGIS_WEB_PUSH_PUBLIC_KEY:-}
      AEGIS_WEB_PUSH_PRIVATE_KEY: ${AEGIS_WEB_PUSH_PRIVATE_KEY:-}
      AEGIS_REMINDER_POLL_SECONDS: ${AEGIS_REMINDER_POLL_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AEGIS_MEMORY_SEMANTIC_ENABLED: ${AEGIS_MEMORY_SEMANTIC_ENABLED:-true}
      AEGIS_MEMORY_EMBEDDING_MODEL: ${AEGIS_MEMORY_EMBEDDING_MODEL:-text-embedding-3-large}
      AEGIS_MEMORY_EMBEDDING_DIMENSIONS: ${AEGIS_MEMORY_EMBEDDING_DIMENSIONS:-1536}
      AEGIS_MEMORY_EMBEDDING_BASE_URL: ${AEGIS_MEMORY_EMBEDDING_BASE_URL:-https://api.openai.com}
      AEGIS_MEMORY_EMBEDDING_API_KEY: ${AEGIS_MEMORY_EMBEDDING_API_KEY:-}
      AEGIS_MEMORY_QDRANT_URL: ${AEGIS_MEMORY_QDRANT_URL:-http://qdrant:6333}
      AEGIS_MEMORY_QDRANT_COLLECTION: ${AEGIS_MEMORY_QDRANT_COLLECTION:-aegis_memory_semantic_large_v1}
      AEGIS_MEMORY_SEMANTIC_SCORE_THRESHOLD: ${AEGIS_MEMORY_SEMANTIC_SCORE_THRESHOLD:-0.45}
      AEGIS_MEMORY_PROJECTION_POLL_SECONDS: ${AEGIS_MEMORY_PROJECTION_POLL_SECONDS:-5}
      AEGIS_MEMORY_GRAPH_ENABLED: ${AEGIS_MEMORY_GRAPH_ENABLED:-true}
      AEGIS_MEMORY_NEO4J_URI: ${AEGIS_MEMORY_NEO4J_URI:-bolt://neo4j:7687}
      AEGIS_MEMORY_NEO4J_USERNAME: ${AEGIS_MEMORY_NEO4J_USERNAME:-neo4j}
      AEGIS_MEMORY_NEO4J_PASSWORD: ${AEGIS_MEMORY_NEO4J_PASSWORD:-${NEO4J_PASSWORD:-aegis_dev_password}}
      AEGIS_MEMORY_NEO4J_DATABASE: ${AEGIS_MEMORY_NEO4J_DATABASE:-neo4j}
      AEGIS_MEMORY_GRAPH_PROJECTION_POLL_SECONDS: ${AEGIS_MEMORY_GRAPH_PROJECTION_POLL_SECONDS:-5}
      AEGIS_MEMORY_GRAPH_MAX_DEPTH: ${AEGIS_MEMORY_GRAPH_MAX_DEPTH:-3}
      AEGIS_MEMORY_GRAPH_MAX_RESULTS: ${AEGIS_MEMORY_GRAPH_MAX_RESULTS:-50}
      AEGIS_MEMORY_AUTOMATIC_WRITES_ENABLED: ${AEGIS_MEMORY_AUTOMATIC_WRITES_ENABLED:-true}
      AEGIS_MEMORY_DIAGNOSTICS_ENABLED: ${AEGIS_MEMORY_DIAGNOSTICS_ENABLED:-false}
      AEGIS_MEMORY_EXTRACTION_MODEL: ${AEGIS_MEMORY_EXTRACTION_MODEL:-gpt-6-luna}
      AEGIS_MEMORY_EXTRACTION_REASONING_EFFORT: ${AEGIS_MEMORY_EXTRACTION_REASONING_EFFORT:-low}
      AEGIS_MEMORY_EXTRACTION_BASE_URL: ${AEGIS_MEMORY_EXTRACTION_BASE_URL:-https://api.openai.com}
      AEGIS_MEMORY_EXTRACTION_API_KEY: ${AEGIS_MEMORY_EXTRACTION_API_KEY:-}
      AEGIS_MEMORY_EXTRACTION_TIMEOUT_SECONDS: ${AEGIS_MEMORY_EXTRACTION_TIMEOUT_SECONDS:-30}
      AEGIS_MEMORY_EXTRACTION_MAX_OUTPUT_TOKENS: ${AEGIS_MEMORY_EXTRACTION_MAX_OUTPUT_TOKENS:-2000}
      AEGIS_MEMORY_EXTRACTION_POLL_SECONDS: ${AEGIS_MEMORY_EXTRACTION_POLL_SECONDS:-5}
      AEGIS_MEMORY_AUTO_CONTEXT_ENABLED: ${AEGIS_MEMORY_AUTO_CONTEXT_ENABLED:-true}
      AEGIS_MEMORY_AUTO_CONTEXT_SCORE_THRESHOLD: ${AEGIS_MEMORY_AUTO_CONTEXT_SCORE_THRESHOLD:-0.60}
      AEGIS_MEMORY_AUTO_CONTEXT_MEMORY_LIMIT: ${AEGIS_MEMORY_AUTO_CONTEXT_MEMORY_LIMIT:-5}
      AEGIS_MEMORY_AUTO_CONTEXT_GRAPH_PATH_LIMIT: ${AEGIS_MEMORY_AUTO_CONTEXT_GRAPH_PATH_LIMIT:-8}
      AEGIS_MEMORY_AUTO_CONTEXT_GRAPH_DEPTH: ${AEGIS_MEMORY_AUTO_CONTEXT_GRAPH_DEPTH:-1}
      AEGIS_MEMORY_AUTO_CONTEXT_MAX_CHARS: ${AEGIS_MEMORY_AUTO_CONTEXT_MAX_CHARS:-3500}
      AEGIS_MEMORY_AUTO_CONTEXT_TIMEOUT_MS: ${AEGIS_MEMORY_AUTO_CONTEXT_TIMEOUT_MS:-2500}
      AEGIS_MEMORY_RECONCILE_INTERVAL_MINUTES: ${AEGIS_MEMORY_RECONCILE_INTERVAL_MINUTES:-30}
      AEGIS_OPENAI_BASE_URL: ${AEGIS_OPENAI_BASE_URL:-https://api.openai.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AEGIS_PUBLIC_APP_URL: ${AEGIS_PUBLIC_APP_URL:-http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8090/api/email/oauth/callback}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly}
      GOOGLE_OAUTH_SUCCESS_REDIRECT_PATH: ${GOOGLE_OAUTH_SUCCESS_REDIRECT_PATH:-/?email=connected}
      GOOGLE_OAUTH_FAILURE_REDIRECT_PATH: ${GOOGLE_OAUTH_FAILURE_REDIRECT_PATH:-/?email=connect_failed}
      AEGIS_CALENDAR_TIMED_REMINDERS: ${AEGIS_CALENDAR_TIMED_REMINDERS:-}
      AEGIS_CALENDAR_ALL_DAY_REMINDERS: ${AEGIS_CALENDAR_ALL_DAY_REMINDERS:-}
      AEGIS_CHAT_MODEL: ${AEGIS_CHAT_MODEL:-gpt-6-luna}
      AEGIS_CHAT_REASONING_EFFORT: ${AEGIS_CHAT_REASONING_EFFORT:-medium}
      AEGIS_TITLE_MODEL: ${AEGIS_TITLE_MODEL:-gpt-5-nano}
      AEGIS_TITLE_REASONING_EFFORT: ${AEGIS_TITLE_REASONING_EFFORT:-minimal}
      AEGIS_TITLE_TIMEOUT_SECONDS: ${AEGIS_TITLE_TIMEOUT_SECONDS:-30}
      AEGIS_TITLE_MAX_OUTPUT_TOKENS: ${AEGIS_TITLE_MAX_OUTPUT_TOKENS:-64}
      AEGIS_OPENAI_STORE_RESPONSES: ${AEGIS_OPENAI_STORE_RESPONSES:-false}
      AEGIS_OPENAI_SERVICE_TIER: ${AEGIS_OPENAI_SERVICE_TIER:-auto}
      AEGIS_MAX_OUTPUT_TOKENS: ${AEGIS_MAX_OUTPUT_TOKENS:-4000}
      AEGIS_TTS_ENABLED: ${AEGIS_TTS_ENABLED:-true}
      AEGIS_TTS_BASE_URL: ${AEGIS_TTS_BASE_URL:-http://10.1.1.47:8001}
      AEGIS_TTS_PROFILE: ${AEGIS_TTS_PROFILE:-AegisVoicev1.0}
      AEGIS_TTS_DEFAULT_PRIORITY: ${AEGIS_TTS_DEFAULT_PRIORITY:-50}
      AEGIS_TTS_CONNECT_TIMEOUT_SECONDS: ${AEGIS_TTS_CONNECT_TIMEOUT_SECONDS:-5}
      AEGIS_TTS_FIRST_AUDIO_TIMEOUT_SECONDS: ${AEGIS_TTS_FIRST_AUDIO_TIMEOUT_SECONDS:-90}
      AEGIS_TTS_IDLE_STREAM_TIMEOUT_SECONDS: ${AEGIS_TTS_IDLE_STREAM_TIMEOUT_SECONDS:-30}
      AEGIS_TTS_API_TOKEN: ${AEGIS_TTS_API_TOKEN:-}
      AEGIS_STT_ENABLED: ${AEGIS_STT_ENABLED:-true}
      AEGIS_STT_PRIMARY_PROVIDER: ${AEGIS_STT_PRIMARY_PROVIDER:-elevenlabs}
      AEGIS_STT_ELEVENLABS_MODEL: ${AEGIS_STT_ELEVENLABS_MODEL:-scribe_v2}
      AEGIS_STT_ELEVENLABS_API_KEY: ${AEGIS_STT_ELEVENLABS_API_KEY:-}
      AEGIS_STT_FALLBACK_ENABLED: ${AEGIS_STT_FALLBACK_ENABLED:-true}
      AEGIS_STT_FALLBACK_PROVIDER: ${AEGIS_STT_FALLBACK_PROVIDER:-openai}
      AEGIS_STT_OPENAI_MODEL: ${AEGIS_STT_OPENAI_MODEL:-gpt-4o-transcribe}
      AEGIS_STT_OPENAI_API_KEY: ${AEGIS_STT_OPENAI_API_KEY:-}
      AEGIS_STT_LANGUAGE: ${AEGIS_STT_LANGUAGE:-por}
      AEGIS_STT_TIMEOUT_SECONDS: ${AEGIS_STT_TIMEOUT_SECONDS:-30}
      AEGIS_STT_MAX_AUDIO_BYTES: ${AEGIS_STT_MAX_AUDIO_BYTES:-20971520}
      AEGIS_STT_MAX_RECORDING_SECONDS: ${AEGIS_STT_MAX_RECORDING_SECONDS:-90}
      AEGIS_STT_MAX_KEYTERMS: ${AEGIS_STT_MAX_KEYTERMS:-80}
      AEGIS_STT_KEYTERMS: ${AEGIS_STT_KEYTERMS:-Aegis;oito;às oito;Qdrant;TTS;STT;GPU;CPU}
      AEGIS_MAX_EMAILS_PER_MANUAL_BRIEFING: ${AEGIS_MAX_EMAILS_PER_MANUAL_BRIEFING:-30}
      AEGIS_MAX_EMAILS_TO_READ_PER_BRIEFING: ${AEGIS_MAX_EMAILS_TO_READ_PER_BRIEFING:-15}
      AEGIS_MAX_EMAIL_BRIEFING_BODY_CHARS: ${AEGIS_MAX_EMAIL_BRIEFING_BODY_CHARS:-500}
      AEGIS_MAX_EMAIL_FULL_BODY_CHARS: ${AEGIS_MAX_EMAIL_FULL_BODY_CHARS:-50000}
      AEGIS_EMAIL_BRIEFING_LOOKBACK_DAYS: ${AEGIS_EMAIL_BRIEFING_LOOKBACK_DAYS:-7}
    ports:
      - "${AEGIS_API_PORT:-8090}:8090"
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: aegis-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26.30-community
    container_name: aegis-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegis_dev_password}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  data_protection_keys:
