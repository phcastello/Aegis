services:
  aegis-pwa:
    build:
      context: ./frontend/aegis-pwa
      dockerfile: Dockerfile
      args:
        # Leave empty in Docker/PWA mode so the frontend calls /api/... through nginx.
        VITE_AEGIS_API_BASE_URL: ${VITE_AEGIS_API_BASE_URL:-}
    container_name: aegis-pwa
    depends_on:
      - aegis-api
    ports:
      - "${AEGIS_FRONTEND_PORT:-5173}:80"

  aegis-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-api
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AegisDatabase: ${AEGIS_DB_CONNECTION_STRING}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AEGIS_MODEL_PROVIDER: ${AEGIS_MODEL_PROVIDER:-openai}
      AEGIS_DEFAULT_MODEL: ${AEGIS_DEFAULT_MODEL:-gpt-5.4-nano}
      AEGIS_MAIN_MODEL: ${AEGIS_MAIN_MODEL:-gpt-5.4-mini}
      AEGIS_ESCALATION_MODEL: ${AEGIS_ESCALATION_MODEL:-gpt-5.4}
      AEGIS_USE_ESCALATION_AUTOMATICALLY: ${AEGIS_USE_ESCALATION_AUTOMATICALLY:-false}
      AEGIS_TITLE_PROVIDER: ${AEGIS_TITLE_PROVIDER:-local}
      AEGIS_TITLE_LOCAL_BASE_URL: ${AEGIS_TITLE_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      AEGIS_TITLE_LOCAL_MODEL: ${AEGIS_TITLE_LOCAL_MODEL:-qwen2.5:3b}
      AEGIS_TITLE_TIMEOUT_SECONDS: ${AEGIS_TITLE_TIMEOUT_SECONDS:-30}
      AEGIS_TITLE_MAX_OUTPUT_TOKENS: ${AEGIS_TITLE_MAX_OUTPUT_TOKENS:-32}
      AEGIS_OPENAI_STORE_RESPONSES: ${AEGIS_OPENAI_STORE_RESPONSES:-false}
      AEGIS_OPENAI_SERVICE_TIER: ${AEGIS_OPENAI_SERVICE_TIER:-auto}
      AEGIS_MAX_OUTPUT_TOKENS: ${AEGIS_MAX_OUTPUT_TOKENS:-4000}
      AEGIS_WEB_SEARCH_ENABLED: ${AEGIS_WEB_SEARCH_ENABLED:-false}
      AEGIS_WEB_SEARCH_REQUIRE_EXPLICIT_REQUEST: ${AEGIS_WEB_SEARCH_REQUIRE_EXPLICIT_REQUEST:-true}
    ports:
      - "${AEGIS_API_PORT:-8080}:8080"

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: aegis-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
