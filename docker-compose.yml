services:
  aegis-pwa:
    build:
      context: ./frontend/aegis-pwa
      dockerfile: Dockerfile
      args:
        # Leave empty in Docker/PWA mode so the frontend calls /api/... through nginx.
        VITE_AEGIS_API_BASE_URL: ${VITE_AEGIS_API_BASE_URL:-}
    container_name: aegis-pwa
    depends_on:
      - aegis-api
    ports:
      - "${AEGIS_FRONTEND_PORT:-5173}:80"

  aegis-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-api
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8090
      ConnectionStrings__AegisDatabase: ${AEGIS_DB_CONNECTION_STRING}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8090/api/email/oauth/callback}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-https://www.googleapis.com/auth/gmail.modify}
      GOOGLE_OAUTH_SUCCESS_REDIRECT_PATH: ${GOOGLE_OAUTH_SUCCESS_REDIRECT_PATH:-/?email=connected}
      GOOGLE_OAUTH_FAILURE_REDIRECT_PATH: ${GOOGLE_OAUTH_FAILURE_REDIRECT_PATH:-/?email=connect_failed}
      AEGIS_MODEL_PROVIDER: ${AEGIS_MODEL_PROVIDER:-openai}
      AEGIS_DEFAULT_MODEL: ${AEGIS_DEFAULT_MODEL:-gpt-5.4-nano}
      AEGIS_MAIN_MODEL: ${AEGIS_MAIN_MODEL:-gpt-5.4-mini}
      AEGIS_ESCALATION_MODEL: ${AEGIS_ESCALATION_MODEL:-gpt-5.4}
      AEGIS_USE_ESCALATION_AUTOMATICALLY: ${AEGIS_USE_ESCALATION_AUTOMATICALLY:-false}
      AEGIS_TITLE_PROVIDER: ${AEGIS_TITLE_PROVIDER:-local}
      AEGIS_TITLE_LOCAL_BASE_URL: ${AEGIS_TITLE_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      AEGIS_TITLE_LOCAL_MODEL: ${AEGIS_TITLE_LOCAL_MODEL:-qwen2.5:3b}
      AEGIS_TITLE_TIMEOUT_SECONDS: ${AEGIS_TITLE_TIMEOUT_SECONDS:-30}
      AEGIS_TITLE_MAX_OUTPUT_TOKENS: ${AEGIS_TITLE_MAX_OUTPUT_TOKENS:-32}
      AEGIS_OPENAI_STORE_RESPONSES: ${AEGIS_OPENAI_STORE_RESPONSES:-false}
      AEGIS_OPENAI_SERVICE_TIER: ${AEGIS_OPENAI_SERVICE_TIER:-auto}
      AEGIS_MAX_OUTPUT_TOKENS: ${AEGIS_MAX_OUTPUT_TOKENS:-4000}
      AEGIS_TTS_ENABLED: ${AEGIS_TTS_ENABLED:-true}
      AEGIS_TTS_BASE_URL: ${AEGIS_TTS_BASE_URL:-http://10.1.1.47:8001}
      AEGIS_TTS_PROFILE: ${AEGIS_TTS_PROFILE:-AegisVoicev1.0}
      AEGIS_TTS_DEFAULT_PRIORITY: ${AEGIS_TTS_DEFAULT_PRIORITY:-50}
      AEGIS_TTS_CONNECT_TIMEOUT_SECONDS: ${AEGIS_TTS_CONNECT_TIMEOUT_SECONDS:-5}
      AEGIS_TTS_FIRST_AUDIO_TIMEOUT_SECONDS: ${AEGIS_TTS_FIRST_AUDIO_TIMEOUT_SECONDS:-90}
      AEGIS_TTS_IDLE_STREAM_TIMEOUT_SECONDS: ${AEGIS_TTS_IDLE_STREAM_TIMEOUT_SECONDS:-30}
      AEGIS_TTS_API_TOKEN: ${AEGIS_TTS_API_TOKEN:-}
      AEGIS_MAX_EMAILS_PER_MANUAL_BRIEFING: ${AEGIS_MAX_EMAILS_PER_MANUAL_BRIEFING:-30}
      AEGIS_MAX_EMAILS_TO_READ_PER_BRIEFING: ${AEGIS_MAX_EMAILS_TO_READ_PER_BRIEFING:-15}
      AEGIS_MAX_EMAIL_BRIEFING_BODY_CHARS: ${AEGIS_MAX_EMAIL_BRIEFING_BODY_CHARS:-500}
      AEGIS_MAX_EMAIL_FULL_BODY_CHARS: ${AEGIS_MAX_EMAIL_FULL_BODY_CHARS:-50000}
      AEGIS_MAX_EMAIL_BODY_CHARS: ${AEGIS_MAX_EMAIL_BODY_CHARS:-}
      AEGIS_EMAIL_BRIEFING_LOOKBACK_DAYS: ${AEGIS_EMAIL_BRIEFING_LOOKBACK_DAYS:-7}
      AEGIS_WEB_SEARCH_ENABLED: ${AEGIS_WEB_SEARCH_ENABLED:-false}
      AEGIS_WEB_SEARCH_REQUIRE_EXPLICIT_REQUEST: ${AEGIS_WEB_SEARCH_REQUIRE_EXPLICIT_REQUEST:-true}
    ports:
      - "${AEGIS_API_PORT:-8090}:8090"
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: aegis-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
  data_protection_keys:
